[project]
name = "genesis"
version = "0.0.1"
description = "Genesis memory architecture — Step 0: DR-37 continuous capture mirror + DR-38 secret hygiene / redaction."
requires-python = ">=3.12"
# Runtime deps deliberately minimal. Step 0 is file I/O + deterministic scrubbing:
# no graph engine (graphiti/falkordb), no LLM, no network. Stdlib only.
dependencies = []

[project.scripts]
# Operates ONLY on provided fixtures/inputs. Does NOT install or activate any live
# Claude Code hook — activation is a separate deploy step (owner go-ahead required).
genesis-setup = "genesis.setup.cli:main"
genesis-capture = "genesis.capture.cli:main"
genesis-save = "genesis.ledger.cli:main"
genesis-diary = "genesis.diary.cli:main"
genesis-drain = "genesis.extraction.cli:main"
genesis-console = "genesis.console.cli:main"
genesis-tasks = "genesis.tasks.cli:main"
genesis-hook = "genesis.hooks.cli:main"
genesis-worker = "genesis.extraction.worker_cli:main"
genesis-backfill = "genesis.backfill.cli:main"
genesis-save-moment = "genesis.save_moment:main"
genesis-install = "genesis.install.cli:main"
genesis-recall-mcp = "genesis.recall.mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
llm = [
    # graphiti-core 0.29.3 passes temperature= to messages.create; anthropic 1.x dropped that param
    # (live-verified 2026-08-26). Pin to the 0.49–<1 line graphiti-core targets.
    "anthropic>=0.49,<1",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
graph = [
    "graphiti-core>=0.29.2",
    "falkordblite>=0.10.0",
    "fastembed>=0.8.0",       # bge-small embedder (graph/graphiti_backend.FastEmbedEmbedder) — live-confirmed missing
    "httpx>=0.27",            # graphiti-core http/LLM client dep (not pulled transitively in the live install)
    "anthropic>=0.49,<1",     # graphiti_backend imports AnthropicClient; 1.x is incompatible (see [llm])
]
mcp = [
    "mcp>=1.0,<2",   # FastMCP lives on the 1.x line; the 2.x restructure removed mcp.server.fastmcp
]
orchestration = [
    "claude-agent-sdk>=0.1.0",
    "langgraph>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genesis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
