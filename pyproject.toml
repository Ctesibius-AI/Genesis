[project]
name = "genesys"
version = "0.0.1"
description = "Genesys memory architecture — Step 0: DR-37 continuous capture mirror + DR-38 secret hygiene / redaction."
requires-python = ">=3.12"
# Runtime deps deliberately minimal. Step 0 is file I/O + deterministic scrubbing:
# no graph engine (graphiti/falkordb), no LLM, no network. Stdlib only.
dependencies = []

[project.scripts]
# Operates ONLY on provided fixtures/inputs. Does NOT install or activate any live
# Claude Code hook — activation is a separate deploy step (owner go-ahead required).
genesys-setup = "genesys.setup.cli:main"
genesys-capture = "genesys.capture.cli:main"
genesys-save = "genesys.ledger.cli:main"
genesys-diary = "genesys.diary.cli:main"
genesys-drain = "genesys.extraction.cli:main"
genesys-console = "genesys.console.cli:main"
genesys-tasks = "genesys.tasks.cli:main"
genesys-hook = "genesys.hooks.cli:main"
genesys-worker = "genesys.extraction.worker_cli:main"
genesys-backfill = "genesys.backfill.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
llm = [
    "anthropic>=0.40",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
graph = [
    "graphiti-core>=0.29.2",
    "falkordblite>=0.10.0",
]
orchestration = [
    "claude-agent-sdk>=0.1.0",
    "langgraph>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genesys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
